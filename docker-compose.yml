services:
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: drom
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: drom
    extra_hosts:
      - "host.docker.internal:host-gateway"